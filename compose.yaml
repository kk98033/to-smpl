services:
  bridge:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/pytorch:26.02-py3}
    image: smpl-0901-bridge:gx10
    init: true
    network_mode: host
    gpus: all
    environment:
      UNITY_HOST: ${UNITY_HOST:-}
    volumes:
      - type: bind
        source: ${SMPL_MODELS_DIR:-./models}
        target: /models
        read_only: true
      - type: bind
        source: ${SMPL_OUTPUT_DIR:-./artifacts/live}
        target: /output
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${UNITY_HOST:?set UNITY_HOST to the Unity PC, VPN, or local IPv4}"
        exec smpl-0901-bridge \
          --input udp://0.0.0.0:9100 \
          --smpl-dir /models \
          --device cuda \
          --axis-map "${SMPL_AXIS_MAP:-x,-y,-z}" \
          --solver-profile "${SMPL_SOLVER_PROFILE:-adaptive-fast}" \
          --learnable-source /opt/to-smpl/archive/Learnable-SMPLify/src \
          --learnable-checkpoint /models/best_ckpt.pth.tar \
          --iterations "${SMPL_ITERATIONS:-50}" \
          --adaptive-seed-iterations "${SMPL_ADAPTIVE_SEED_ITERATIONS:-50}" \
          --adaptive-og-stride "${SMPL_ADAPTIVE_OG_STRIDE:-4}" \
          --adaptive-coherence-threshold "${SMPL_ADAPTIVE_COHERENCE_THRESHOLD:-0.55}" \
          --adaptive-speed-threshold "${SMPL_ADAPTIVE_SPEED_THRESHOLD:-0.3}" \
          --adaptive-medium-steps "${SMPL_ADAPTIVE_MEDIUM_STEPS:-1}" \
          --adaptive-high-steps "${SMPL_ADAPTIVE_HIGH_STEPS:-2}" \
          --unity-host "$${UNITY_HOST}" \
          --unity-port 9095 \
          --raw-skeleton-host "$${UNITY_HOST}" \
          --raw-skeleton-port 9096 \
          --fit-profile "${SMPL_FIT_PROFILE:-upper-body}" \
          --calibration-frames "${SMPL_CALIBRATION_FRAMES:-30}" \
          --beta-limit "${SMPL_BETA_LIMIT:-3.0}" \
          --endpoint-weight "${SMPL_ENDPOINT_WEIGHT:-0.5}" \
          --torso-weight "${SMPL_TORSO_WEIGHT:-0.05}" \
          --spine-stability-weight "${SMPL_SPINE_STABILITY_WEIGHT:-0.02}" \
          --body-facing-weight "${SMPL_BODY_FACING_WEIGHT:-0.01}" \
          --max-fit-residual-mm "${SMPL_MAX_FIT_RESIDUAL_MM:-100}" \
          --max-twist-deg "${SMPL_MAX_TWIST_DEG:-100}" \
          --max-delta-deg "${SMPL_MAX_DELTA_DEG:-90}" \
          --max-facing-mismatch-deg "${SMPL_MAX_FACING_MISMATCH_DEG:-90}" \
          --fit-jsonl /output/smpl_fit.jsonl \
          --dashboard-recording-control /output/dashboard_recordings/control.json \
          --mesh-preview-json /output/smpl_mesh.json \
          --mesh-preview-faces "${SMPL_MESH_PREVIEW_FACES:-2400}" \
          --smplx-preview-json /output/smplx_mesh.json \
          --smplx-preview-faces "${SMPLX_MESH_PREVIEW_FACES:-20908}" \
          --diagnostic-log-every "${SMPL_DIAGNOSTIC_LOG_EVERY:-10}"
